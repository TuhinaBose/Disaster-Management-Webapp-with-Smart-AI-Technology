{% extends 'base.html' %}

{% block title %}Sign In - RADAR Disaster Management System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="tile-icon-box bg-icon-blue mx-auto mb-3">
                        <i class="fa-solid fa-right-to-bracket fs-3"></i>
                    </div>
                    <h4 class="fw-bold text-white mb-1">Account Sign In</h4>
                    <p class="text-muted small mb-0">Sign in to manage your SOS requests and emergency settings.</p>
                </div>

                <form method="POST" action="{{ url_for('main.login') }}">
                    <div class="mb-3">
                        <label class="form-label text-slate-300 small fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark text-primary border-secondary"><i class="fa-solid fa-user"></i></span>
                            <input type="text" name="username" class="form-control bg-dark text-white border-secondary" placeholder="Username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-slate-300 small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark text-primary border-secondary"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="Password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
                    </button>

                    <div class="text-center mt-3">
                        <small class="text-muted">Don't have an account yet? <a href="{{ url_for('main.register') }}" class="text-cyan fw-bold text-decoration-none">Create Account</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
